{{- if .Values.backupRestore.enabled }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ .Values.backupRestore.namePrefix }}-restore
spec:
  # Run on demand: kubectl create job --from=cronjob/{{ .Values.backupRestore.namePrefix }}-restore {{ .Values.backupRestore.namePrefix }}-restore-manual -n {{ .Values.backupRestore.app.namespace }}
  # Kept suspended by default — this is a disaster-recovery tool, not a
  # migration pull like the WordPress sites' restore cronjobs. Trigger it
  # manually when an actual restore is needed.
  suspend: {{ .Values.backupRestore.suspendRestore }}
  schedule: "{{ .Values.backupRestore.restoreSchedule }}"
  timeZone: "{{ .Values.backupRestore.timeZone | default "UTC" }}"
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 3600
      template:
        spec:
          serviceAccountName: {{ .Values.backupRestore.namePrefix }}-backup-sa
          restartPolicy: OnFailure
          containers:
            - name: app-restore
              image: "pjamenaja/onix-v2-jobs:{{ .Values.onixJobs.imageTag }}"
              imagePullPolicy: IfNotPresent
              command: ["ruby"]
              args: ["app-restore.rb"]
              env:
                {{- include "backupRestore.env" . | nindent 16 }}
                - name: RESTART_APP_POD
                  value: "{{ .Values.backupRestore.restartAppPodAfterRestore }}"
{{- end }}
