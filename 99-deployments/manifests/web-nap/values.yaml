wordpress:
  enabled: true
  replicaCount: 1
  wordpressScheme: https
  wordpressUsername: admin
  existingSecret: 'wordpress-user-login'

  readinessProbe:
    enabled: false

  image:
    tag: 6.8.2
    repository: bitnamilegacy/wordpress

  ingress:
    annotations:
      nginx.ingress.kubernetes.io/proxy-body-size: 50m
      kubernetes.io/ingress.allow-http: "true" #Wordpress will redirect to https internally

    ingressClassName: nginx
    enabled: true
    hostname: natureagroproduct.com
    extraHosts:
      - name: www.natureagroproduct.com
      - name: nap.wintech-thai.com

  service:
    type: ClusterIP

  mariadb:
    enabled: false

  externalDatabase:
    host: web-nap-main-mysql
    port: 3306
    database: wordpress
    user: root
    existingSecret: wordpress-db-login

mysql:
  enabled: true
  image:
    repository: bitnamilegacy/mysql
    tag: 8.0.28
  auth:
    database: wordpress
    existingSecret: wordpress-db-login

# onix-v2-jobs image for the backup/restore CronJobs below. Bump this after
# tagging a new onix-v2-jobs release (Docker Hub: pjamenaja/onix-v2-jobs).
onixJobs:
  imageTag: v1.0.26

# The real backup for this site currently runs on its old GCP server
# (~05:00-06:00 Asia/Bangkok daily), uploading to the devhubs-backup bucket.
# On-prem's own backup stays suspended until after DNS cutover; restore runs
# daily shortly after the GCP backup window to keep this on-prem copy synced
# in the meantime.
backupRestore:
  enabled: true
  namePrefix: nap
  timeZone: "Asia/Bangkok"

  backupSchedule: "0 19 * * *"
  restoreSchedule: "30 6 * * *"
  suspendBackup: true
  suspendRestore: false
  restartAppPodAfterRestore: "true"

  db:
    type: mysql
    namespace: web-nap
    podName: web-nap-main-mysql-0

  app:
    namespace: web-nap
    podKeyword: wordpress
    dataPath: /bitnami/wordpress

  storage:
    url: https://storage.googleapis.com
    bucket: devhubs-backup
    bucketPath: nap
    filePrefix: wp-backup-gke
